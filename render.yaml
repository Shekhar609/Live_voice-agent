services:
  - type: web
    name: polyscribe-stt
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polyscribe-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: polyscribe-db
    plan: free
    databaseName: speech_db
    user: postgres
